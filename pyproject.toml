[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-model"
version = "0.1.0"
description = "Barra-style cross-sectional equity factor risk model for an NSE universe"
requires-python = ">=3.11"

[project.scripts]
factor-model = "factor_model.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
